<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>货物进出记录</title>

<!-- PWA 配置 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f5df0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="进出货记录">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #1e2330;
    --muted: #6b7280;
    --border: #e3e5ea;
    --in: #1f9d63;
    --in-bg: #e7f7ef;
    --out: #d64545;
    --out-bg: #fceaea;
    --warn: #b8860b;
    --warn-bg: #fdf3d9;
    --accent: #2f5df0;
    --accent-hover: #2649c4;
    --row-hover: #f7f8fa;
    --sub-bg: #fafbfc;
  }

  * { box-sizing: border-box; }

  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 32px 16px;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 8px;
  }

  h1 {
    font-size: 24px;
    margin: 0;
    letter-spacing: -0.3px;
  }

  header .sub {
    color: var(--muted);
    font-size: 13px;
  }

  .lang-switch select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .panel h2 {
    font-size: 15px;
    margin: 0 0 16px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 12px;
    color: var(--muted);
  }

  input, select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
    font-family: inherit;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .type-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .type-toggle button {
    flex: 1;
    border: none;
    padding: 10px 0;
    background: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
  }

  .type-toggle button.active.in { background: var(--in-bg); color: var(--in); }
  .type-toggle button.active.out { background: var(--out-bg); color: var(--out); }

  .import-row {
    display: flex;
    gap: 10px;
    align-items: end;
    flex-wrap: wrap;
  }

  .import-row .field { min-width: 140px; }

  form#manualForm {
    display: grid;
    grid-template-columns: 1.6fr 1fr 0.9fr 0.9fr 1fr 1.2fr 1.4fr 1.2fr auto;
    gap: 10px;
    align-items: end;
  }

  .add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    height: 42px;
  }
  .add-btn:hover { background: var(--accent-hover); }

  @media (max-width: 1000px) {
    form#manualForm { grid-template-columns: 1fr 1fr; }
    form#manualForm .add-btn { grid-column: span 2; }
  }

  .file-btn {
    background: #fff;
    border: 1px dashed var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  .file-btn:hover { border-color: var(--accent); color: var(--accent); }

  .import-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    height: 42px;
  }
  .import-btn:hover { opacity: 0.85; }

  .import-status {
    font-size: 13px;
    color: var(--muted);
  }
  .import-status.ok { color: var(--in); }
  .import-status.err { color: var(--out); }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: end;
  }

  .toolbar .field { min-width: 150px; }

  .toolbar input[type="text"] {
    flex: 1;
    min-width: 180px;
  }

  .export-btn {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    height: 42px;
  }
  .export-btn:hover { background: var(--bg); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th {
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding: 10px 8px;
  }

  td {
    padding: 12px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tr.item-row { cursor: pointer; }
  tr.item-row:hover { background: var(--row-hover); }
  tr.item-row.expanded { background: var(--row-hover); }
  tr:last-child td { border-bottom: none; }

  .chevron {
    display: inline-block;
    transition: transform 0.15s ease;
    color: var(--muted);
    margin-right: 6px;
    font-size: 11px;
  }
  tr.item-row.expanded .chevron { transform: rotate(90deg); }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.in { background: var(--in-bg); color: var(--in); }
  .badge.out { background: var(--out-bg); color: var(--out); }

  .pill {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    background: #eef0f4;
    color: var(--ink);
    margin: 2px 3px 2px 0;
  }

  .expiry-tag {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .expiry-tag.ok { color: var(--muted); background: #eef0f4; }
  .expiry-tag.soon { color: var(--warn); background: var(--warn-bg); }
  .expiry-tag.expired { color: var(--out); background: var(--out-bg); }
  .expiry-tag.none { color: var(--muted); }

  .qty { font-variant-numeric: tabular-nums; font-weight: 600; }

  .del-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .del-btn:hover { background: var(--out-bg); color: var(--out); }
  .balance-cell { font-size: 16px; font-weight: 700; }

  .detail-row td {
    background: var(--sub-bg);
    padding: 0;
  }

  .detail-wrap {
    padding: 6px 16px 16px 40px;
  }

  .detail-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .detail-table th {
    background: #f1f2f5;
    font-size: 11px;
    padding: 8px 10px;
  }

  .detail-table td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
  }
  .detail-table tr:last-child td { border-bottom: none; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px 0;
    font-size: 14px;
  }

  @media (max-width: 800px) {
    .detail-wrap { padding: 6px 8px 16px 16px; }
  }

  /* ---------- 移动端：表格转卡片布局 ---------- */
  @media (max-width: 700px) {
    body { padding: 16px 10px; }
    .wrap { max-width: 100%; }
    .panel { padding: 16px; }

    table:not(.detail-table) thead { display: none; }
    table:not(.detail-table),
    table:not(.detail-table) tbody,
    table:not(.detail-table) tr,
    table:not(.detail-table) td {
      display: block;
      width: 100%;
    }
    tr.item-row {
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
    }
    tr.item-row td {
      border: none;
      padding: 5px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    tr.item-row td::before {
      content: attr(data-label);
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    tr.item-row td.name-cell {
      font-size: 15px;
      font-weight: 600;
    }
    tr.item-row td.name-cell::before { content: none; }
    .cell-value {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: 100%;
    }
    .detail-row td { display: block; width: 100%; padding: 0; max-width: 100%; }
    .detail-wrap { padding: 6px 4px 16px 4px; max-width: 100%; }

    .detail-table thead { display: none; }
    .detail-table, .detail-table tbody, .detail-table tr, .detail-table td {
      display: block;
      width: 100%;
    }
    .detail-table tr {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .detail-table td {
      border: none;
      padding: 4px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .detail-table td::before {
      content: attr(data-label);
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .detail-table td[data-label=""]::before { content: none; }

    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar .field { min-width: 0; }
    .toolbar input[type="text"] { min-width: 0; }
    .toolbar select, .toolbar input { max-width: 100%; }

    .import-row { flex-direction: column; align-items: stretch; }
    .import-row .field { min-width: 0; }
    .import-row .type-toggle { width: 100% !important; }

    form#manualForm { grid-template-columns: 1fr !important; }
    form#manualForm .add-btn { grid-column: span 1 !important; }

    .pill, .badge, .expiry-tag { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 data-i18n="appTitle">货物进出记录</h1>
      <div class="sub" data-i18n="appSubtitle">按货物显示总库存 — 点击列表可查看该货物的进出明细</div>
    </div>
    <div class="lang-switch">
      <select id="langSelect">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ms">Bahasa Melayu</option>
      </select>
    </div>
  </header>

  <div class="panel">
    <h2 data-i18n="importPanelTitle">从 Excel 导入</h2>
    <div class="import-row">
      <div class="field">
        <label for="importType" data-i18n="importTypeLabel">导入类型</label>
        <div class="type-toggle" style="width:140px;">
          <button type="button" id="importBtnIn" class="active in" data-i18n="typeIn">入库</button>
          <button type="button" id="importBtnOut" class="out" data-i18n="typeOut">出库</button>
        </div>
      </div>
      <div class="field">
        <label for="importDate" data-i18n="dateLabel">日期</label>
        <input type="date" id="importDate">
      </div>
      <div class="field">
        <label for="excelFile" data-i18n="excelFileLabel">Excel 文件 (.xlsx/.csv)</label>
        <input type="file" id="excelFile" accept=".xlsx,.xls,.csv" class="file-btn">
      </div>
      <button type="button" id="importBtn" class="import-btn" data-i18n="importBtnText">导入 Excel</button>
      <span class="import-status" id="importStatus"></span>
    </div>
  </div>

  <div class="panel">
    <h2 data-i18n="manualPanelTitle">手动新增进出记录</h2>
    <form id="manualForm">
      <div class="field">
        <label for="manName" data-i18n="itemNameLabel">货物名称</label>
        <input type="text" id="manName" placeholder="例如：钢螺栓 M6" data-i18n-ph="itemNamePlaceholder" required autocomplete="off" list="itemNameList">
        <datalist id="itemNameList"></datalist>
      </div>
      <div class="field">
        <label for="manCode" data-i18n="itemCodeLabel">货物编号</label>
        <input type="text" id="manCode" placeholder="选填" data-i18n-ph="optionalPlaceholder" autocomplete="off">
      </div>
      <div class="field">
        <label for="manQty" data-i18n="qtyLabel">数量</label>
        <input type="number" id="manQty" min="1" step="1" placeholder="0" required>
      </div>
      <div class="field">
        <label for="manUom" data-i18n="uomLabel">UOM</label>
        <input type="text" id="manUom" placeholder="例如：pcs, box, kg" data-i18n-ph="uomPlaceholder">
      </div>
      <div class="field">
        <label data-i18n="typeLabel">类型</label>
        <div class="type-toggle">
          <button type="button" id="manTypeIn" class="active in" data-i18n="typeIn">入库</button>
          <button type="button" id="manTypeOut" class="out" data-i18n="typeOut">出库</button>
        </div>
      </div>
      <div class="field">
        <label for="manDate" data-i18n="dateLabel">日期</label>
        <input type="date" id="manDate" required>
      </div>
      <div class="field">
        <label for="manPlatform" data-i18n="platformLabel">Platform/Vessel</label>
        <input type="text" id="manPlatform" placeholder="选填" data-i18n-ph="optionalPlaceholder" autocomplete="off" list="platformList">
        <datalist id="platformList"></datalist>
      </div>
      <div class="field">
        <label for="manExpiry" data-i18n="expiryDateLabel">过期日期</label>
        <input type="date" id="manExpiry">
      </div>
      <button type="submit" class="add-btn" data-i18n="addRecordBtn">新增记录</button>
    </form>
  </div>

  <div class="panel">
    <h2 data-i18n="overviewPanelTitle">货物库存总览</h2>
    <div class="toolbar">
      <input type="text" id="search" placeholder="搜索货物名称或编号..." data-i18n-ph="searchPlaceholder" autocomplete="off" list="searchSuggestList">
      <datalist id="searchSuggestList"></datalist>
      <div class="field">
        <label for="filterPlatform" data-i18n="platformLabel">Platform / Vessel</label>
        <select id="filterPlatform">
          <option value="all" data-i18n="allPlatforms">全部平台/船只</option>
        </select>
      </div>
      <div class="field">
        <label for="filterExpiry" data-i18n="expiryStatusLabel">过期状态</label>
        <select id="filterExpiry">
          <option value="all" data-i18n="expiryAll">全部</option>
          <option value="expired" data-i18n="expiryExpired">已过期</option>
          <option value="soon" data-i18n="expirySoon">30天内到期</option>
          <option value="ok" data-i18n="expiryOk">尚未临近到期</option>
          <option value="none" data-i18n="expiryNone">无过期日期</option>
        </select>
      </div>
      <div class="field">
        <label for="sortBy" data-i18n="sortByLabel">排序方式</label>
        <select id="sortBy">
          <option value="item" data-i18n="sortItem">货物名称</option>
          <option value="expiry" data-i18n="sortExpiry">最近过期日期</option>
          <option value="balance" data-i18n="sortBalance">库存数量</option>
        </select>
      </div>
      <button class="export-btn" id="exportBtn" data-i18n="exportBtnText">导出 CSV</button>
    </div>
    <table>
      <thead>
        <tr>
          <th data-i18n="colCode">编号</th>
          <th data-i18n="colItem">货物名称</th>
          <th data-i18n="colUom">UOM</th>
          <th data-i18n="colBalance">库存总数</th>
          <th data-i18n="colPlatform">Platform/Vessel</th>
          <th data-i18n="colExpiry">最近过期日期</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;" data-i18n="emptyStateText">暂无记录，请先在上方导入 Excel 文件。</div>
  </div>

</div>

      itemNamePlaceholder: 'contoh: Bolt Keluli M6',
      optionalPlaceholder: 'Pilihan',

      typeLabel: 'Jenis',

      expiryDateLabel: 'Tarikh Luput',
      addRecordBtn: 'Tambah Rekod',
      overviewPanelTitle: 'Gambaran Stok Barang',
      searchPlaceholder: 'Cari nama atau kod barang...',
      allPlatforms: 'Semua platform',
      expiryStatusLabel: 'Status Luput',
      expiryAll: 'Semua',
      expiryExpired: 'Telah Luput',
      expirySoon: 'Luput dalam 30 hari',
      expiryOk: 'Belum hampir luput',
      expiryNone: 'Tiada tarikh luput',
      sortByLabel: 'Susun ikut',
      sortItem: 'Nama barang',
      sortExpiry: 'Tarikh luput terdekat',
      sortBalance: 'Baki stok',
      exportBtnText: 'Eksport CSV',
      colCode: 'Kod',
      colItem: 'Barang',
      colUom: 'UOM',
      colBalance: 'Baki',
      colPlatform: 'Platform/Vessel',
      colExpiry: 'Luput Terdekat',
      colDate: 'Tarikh',
      colType: 'Jenis',
      colQty: 'Kuantiti',
      emptyStateText: 'Belum ada rekod. Sila import fail Excel di atas.',
      deleteBtn: 'Padam',
      deleteRecordTitle: 'Padam rekod ini',
      deleteConfirm: 'Anda pasti mahu memadam rekod ini? Tindakan ini tidak boleh dibatalkan.',
      expiredSuffix: 'telah luput',
      expiringSoonSuffix: 'hampir luput',
      chooseFileFirst: 'Sila pilih fail dahulu.',
      xlsxLibFailed: 'Gagal memuatkan pustaka Excel — sila semak sambungan internet anda.',
      noRowsFound: 'Tiada baris data dijumpai dalam fail.',
      importedOk: '{count} rekod telah diimport (jenis: {type}).',
      importedPartial: '{count} rekod diimport, {skipped} dilangkau (nama/kuantiti tiada).',
      noValidRows: 'Tiada baris sah dijumpai. Sila semak lajur nama barang dan kuantiti.',
      fileReadError: 'Tidak dapat membaca fail ini. Pastikan ia fail .xlsx, .xls, atau .csv yang sah.'
    }
  };

  let currentLang = localStorage.getItem('stockAppLang') || 'en';
  if (!translations[currentLang]) currentLang = 'en';

  function t(key, params) {
    let str = (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || key;
    if (params) {
      Object.keys(params).forEach(k => {
        str = str.replace(`{${k}}`, params[k]);
      });
    }
    return str;
  }

  function applyStaticTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
    });
    document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : currentLang === 'ms' ? 'ms' : 'en';
  }

  const langSelect = document.getElementById('langSelect');
  langSelect.value = currentLang;
  applyStaticTranslations();

  langSelect.addEventListener('change', () => {
    currentLang = langSelect.value;
    localStorage.setItem('stockAppLang', currentLang);
    applyStaticTranslations();
    render();
  });

  const STORAGE_KEY = 'stockRecords_v1';
  let records = [];
  let expanded = new Set(); // groupKeys currently expanded

  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) records = JSON.parse(saved);
  } catch (e) { records = []; }

  const tableBody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('search');
  const filterPlatform = document.getElementById('filterPlatform');
  const filterExpiry = document.getElementById('filterExpiry');
  const sortBy = document.getElementById('sortBy');

  document.getElementById('importDate').valueAsDate = new Date();

  let importType = 'IN';
  const importBtnIn = document.getElementById('importBtnIn');
  const importBtnOut = document.getElementById('importBtnOut');

  importBtnIn.addEventListener('click', () => setImportType('IN'));
  importBtnOut.addEventListener('click', () => setImportType('OUT'));

  function setImportType(type) {
    importType = type;
    importBtnIn.classList.toggle('active', type === 'IN');
    importBtnOut.classList.toggle('active', type === 'OUT');
  }

  // ---- 手动新增记录 ----
  const manualForm = document.getElementById('manualForm');
  const manName = document.getElementById('manName');
  const manCode = document.getElementById('manCode');
  const manQty = document.getElementById('manQty');
  const manUom = document.getElementById('manUom');
  const manDate = document.getElementById('manDate');
  const manPlatform = document.getElementById('manPlatform');
  const manExpiry = document.getElementById('manExpiry');
  const manTypeIn = document.getElementById('manTypeIn');
  const manTypeOut = document.getElementById('manTypeOut');
  const itemNameList = document.getElementById('itemNameList');
  const platformList = document.getElementById('platformList');
  const searchSuggestList = document.getElementById('searchSuggestList');

  document.getElementById('manDate').valueAsDate = new Date();

  let manualType = 'IN';
  manTypeIn.addEventListener('click', () => setManualType('IN'));
  manTypeOut.addEventListener('click', () => setManualType('OUT'));

  function setManualType(type) {
    manualType = type;
    manTypeIn.classList.toggle('active', type === 'IN');
    manTypeOut.classList.toggle('active', type === 'OUT');
  }

  manualForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const item = manName.value.trim();
    const itemCode = manCode.value.trim();
    const qty = parseFloat(manQty.value);
    const uom = manUom.value.trim();
    const date = manDate.value;
    const platform = manPlatform.value.trim();
    const expiryDate = manExpiry.value;

    if (!item || !qty || qty <= 0 || !date) return;

    records.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      item,
      itemCode,
      qty,
      uom,
      type: manualType,
      date,
      platform,
      expiryDate
    });

    save();
    render();

    manualForm.reset();
    document.getElementById('manDate').valueAsDate = new Date();
    setManualType('IN');
    manName.focus();
  });

  // 根据现有记录自动填充“货物名称”“Platform/Vessel”“搜索”的建议列表
  function populateSuggestLists() {
    const names = new Set();
    const platforms = new Set();
    records.forEach(r => {
      if (r.item) names.add(r.item);
      if (r.platform) platforms.add(r.platform);
    });

    const nameOptions = Array.from(names).sort().map(n => `<option value="${escapeHtml(n)}">`).join('');
    itemNameList.innerHTML = nameOptions;
    searchSuggestList.innerHTML = nameOptions;
    platformList.innerHTML = Array.from(platforms).sort().map(p => `<option value="${escapeHtml(p)}">`).join('');
  }

  // 货物名称 -> 货物编号 映射（取该货物最近使用过的编号）
  function getNameToCodeMap() {
    const map = {};
    records.forEach(r => {
      if (r.item && r.itemCode) {
        map[r.item.trim().toLowerCase()] = r.itemCode;
      }
    });
    return map;
  }

  // 当输入或选中的货物名称与已有记录完全匹配时，自动带出对应的货物编号
  function tryAutofillCode() {
    const map = getNameToCodeMap();
    const match = map[manName.value.trim().toLowerCase()];
    if (match) {
      manCode.value = match;
    }
  }

  manName.addEventListener('input', tryAutofillCode);
  manName.addEventListener('change', tryAutofillCode);

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  function groupKey(r) {
    // group by item code when present, otherwise by item name
    return (r.itemCode && r.itemCode.trim()) ? 'code:' + r.itemCode.trim().toLowerCase() : 'name:' + r.item.trim().toLowerCase();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Build per-item groups: running balance, transaction list, platforms, nearest expiry
  function buildGroups() {
    const sorted = records.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const groups = {};

    sorted.forEach(r => {
      const key = groupKey(r);
      if (!groups[key]) {
        groups[key] = {
          key,
          item: r.item,
          itemCode: r.itemCode || '',
          uom: r.uom || '',
          balance: 0,
          platforms: new Set(),
          transactions: []
        };
      }
      const g = groups[key];
      g.balance += r.type === 'IN' ? r.qty : -r.qty;
      if (r.uom) g.uom = r.uom;
      if (r.platform) g.platforms.add(r.platform);
      g.transactions.push({ ...r, runningBalance: g.balance });
    });

    // nearest (soonest) expiry per group, ignoring blanks
    Object.values(groups).forEach(g => {
      const dates = g.transactions.map(t => t.expiryDate).filter(Boolean).sort();
      g.nearestExpiry = dates.length ? dates[0] : '';
      g.transactions.reverse(); // newest first for display
    });

    return Object.values(groups);
  }

  function expiryStatus(dateStr) {
    if (!dateStr) return 'none';
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const exp = new Date(dateStr);
    if (isNaN(exp.getTime())) return 'none';
    const diffDays = Math.floor((exp - today) / (1000 * 60 * 60 * 24));
    if (diffDays < 0) return 'expired';
    if (diffDays <= 30) return 'soon';
    return 'ok';
  }

  function expiryLabel(dateStr) {
    const status = expiryStatus(dateStr);
    if (status === 'none') return '<span class="expiry-tag none">—</span>';
    if (status === 'expired') return `<span class="expiry-tag expired">${dateStr} · ${t('expiredSuffix')}</span>`;
    if (status === 'soon') return `<span class="expiry-tag soon">${dateStr} · ${t('expiringSoonSuffix')}</span>`;
    return `<span class="expiry-tag ok">${dateStr}</span>`;
  }

  function populatePlatformFilter(groups) {
    const current = filterPlatform.value;
    const platforms = new Set();
    groups.forEach(g => g.platforms.forEach(p => platforms.add(p)));
    const sortedPlatforms = Array.from(platforms).sort();

    filterPlatform.innerHTML = `<option value="all">${t('allPlatforms')}</option>` +
      sortedPlatforms.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');

    if (sortedPlatforms.includes(current)) filterPlatform.value = current;
  }

  function render() {
    let groups = buildGroups();
    populatePlatformFilter(groups);
    populateSuggestLists();

    const q = searchInput.value.trim().toLowerCase();
    const platformF = filterPlatform.value;
    const expiryF = filterExpiry.value;
    const sortF = sortBy.value;

    groups = groups.filter(g => {
      const matchesSearch = !q || g.item.toLowerCase().includes(q) || g.itemCode.toLowerCase().includes(q);
      const matchesPlatform = platformF === 'all' || g.platforms.has(platformF);
      const matchesExpiry = expiryF === 'all' || expiryStatus(g.nearestExpiry) === expiryF;
      return matchesSearch && matchesPlatform && matchesExpiry;
    });

    if (sortF === 'item') {
      groups.sort((a, b) => a.item.localeCompare(b.item));
    } else if (sortF === 'expiry') {
      groups.sort((a, b) => {
        if (!a.nearestExpiry) return 1;
        if (!b.nearestExpiry) return -1;
        return a.nearestExpiry.localeCompare(b.nearestExpiry);
      });
    } else if (sortF === 'balance') {
      groups.sort((a, b) => b.balance - a.balance);
    }

    tableBody.innerHTML = '';
    emptyState.style.display = groups.length ? 'none' : 'block';

    groups.forEach(g => {
      const isExpanded = expanded.has(g.key);
      const platformPills = g.platforms.size
        ? Array.from(g.platforms).map(p => `<span class="pill">${escapeHtml(p)}</span>`).join('')
        : '<span class="expiry-tag none">—</span>';

      const row = document.createElement('tr');
      row.className = 'item-row' + (isExpanded ? ' expanded' : '');
      row.innerHTML = `
        <td data-label="${t('colCode')}">${escapeHtml(g.itemCode)}</td>
        <td class="name-cell"><span class="chevron">▶</span>${escapeHtml(g.item)}</td>
        <td data-label="${t('colUom')}">${escapeHtml(g.uom)}</td>
        <td data-label="${t('colBalance')}" class="balance-cell">${g.balance}</td>
        <td data-label="${t('colPlatform')}"><span class="cell-value">${platformPills}</span></td>
        <td data-label="${t('colExpiry')}">${expiryLabel(g.nearestExpiry)}</td>
      `;
      row.addEventListener('click', () => {
        if (expanded.has(g.key)) expanded.delete(g.key);
        else expanded.add(g.key);
        render();
      });
      tableBody.appendChild(row);

      if (isExpanded) {
        const detailRow = document.createElement('tr');
        detailRow.className = 'detail-row';
        const txRows = g.transactions.map(t2 => `
          <tr>
            <td data-label="${t('colDate')}">${t2.date}</td>
            <td data-label="${t('colType')}"><span class="badge ${t2.type === 'IN' ? 'in' : 'out'}">${t2.type === 'IN' ? t('typeIn') : t('typeOut')}</span></td>
            <td data-label="${t('colQty')}" class="qty">${t2.type === 'IN' ? '+' : '-'}${t2.qty}</td>
            <td data-label="${t('colPlatform')}"><span class="cell-value">${escapeHtml(t2.platform || '—')}</span></td>
            <td data-label="${t('colExpiry')}">${expiryLabel(t2.expiryDate)}</td>
            <td data-label="${t('colBalance')}" class="qty">${t2.runningBalance}</td>
            <td data-label=""><button class="del-btn" data-id="${t2.id}" title="${t('deleteRecordTitle')}">✕ ${t('deleteBtn')}</button></td>
          </tr>
        `).join('');

        detailRow.innerHTML = `
          <td colspan="6">
            <div class="detail-wrap">
              <table class="detail-table">
                <thead>
                  <tr>
                    <th>${t('colDate')}</th>
                    <th>${t('colType')}</th>
                    <th>${t('colQty')}</th>
                    <th>${t('colPlatform')}</th>
                    <th>${t('colExpiry')}</th>
                    <th>${t('colBalance')}</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>${txRows}</tbody>
              </table>
            </div>
          </td>
        `;
        tableBody.appendChild(detailRow);

        detailRow.querySelectorAll('.del-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!confirm(t('deleteConfirm'))) return;
            records = records.filter(r => r.id !== btn.dataset.id);
            save();
            render();
          });
        });
      }
    });
  }

  searchInput.addEventListener('input', render);
  filterPlatform.addEventListener('change', render);
  filterExpiry.addEventListener('change', render);
  sortBy.addEventListener('change', render);

  document.getElementById('exportBtn').addEventListener('click', () => {
    const header = ['Date', 'Code', 'Item', 'Type', 'Quantity', 'UOM', 'Platform/Vessel', 'Expiry Date', 'Running Balance'];
    const groups = buildGroups();
    const rows = [];
    groups.forEach(g => {
      g.transactions.slice().reverse().forEach(t => {
        rows.push([t.date, g.itemCode, g.item, t.type, t.qty, g.uom, t.platform || '', t.expiryDate || '', t.runningBalance]);
      });
    });
    const csv = [header, ...rows]
      .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
      .join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'stock_records.csv';
    a.click();
    URL.revokeObjectURL(url);
  });

  // --- Excel / CSV import ---
  const importStatus = document.getElementById('importStatus');

  function setImportStatus(msg, kind) {
    importStatus.textContent = msg;
    importStatus.className = 'import-status' + (kind ? ' ' + kind : '');
  }

  // Matches flexible header names to our fields
  function findKey(rowObj, candidates) {
    const keys = Object.keys(rowObj);
    for (const cand of candidates) {
      const hit = keys.find(k => k.trim().toLowerCase() === cand);
      if (hit) return hit;
    }
    // fallback: partial match
    for (const cand of candidates) {
      const hit = keys.find(k => k.trim().toLowerCase().includes(cand));
      if (hit) return hit;
    }
    return null;
  }

  // Excel may give dates as serial numbers or as strings; normalize to YYYY-MM-DD
  function formatExcelDate(value) {
    if (value === null || value === undefined || value === '') return '';
    if (typeof value === 'number') {
      const parsed = XLSX.SSF.parse_date_code(value);
      if (parsed) {
        const mm = String(parsed.m).padStart(2, '0');
        const dd = String(parsed.d).padStart(2, '0');
        return `${parsed.y}-${mm}-${dd}`;
      }
    }
    const str = String(value).trim();
    const asDate = new Date(str);
    if (!isNaN(asDate.getTime()) && /\d/.test(str)) {
      const yyyy = asDate.getFullYear();
      const mm = String(asDate.getMonth() + 1).padStart(2, '0');
      const dd = String(asDate.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }
    return str;
  }

  document.getElementById('importBtn').addEventListener('click', () => {
    const fileInput = document.getElementById('excelFile');
    const file = fileInput.files[0];
    const date = document.getElementById('importDate').value || new Date().toISOString().slice(0, 10);

    if (!file) {
      setImportStatus(t('chooseFileFirst'), 'err');
      return;
    }
    if (typeof XLSX === 'undefined') {
      setImportStatus(t('xlsxLibFailed'), 'err');
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

        if (!rows.length) {
          setImportStatus(t('noRowsFound'), 'err');
          return;
        }

        const nameKeys = ['item name', 'item', 'name', 'description', 'product'];
        const codeKeys = ['item code', 'code', 'sku', 'item no', 'item number', 'part no'];
        const qtyKeys = ['quantity', 'qty'];
        const uomKeys = ['uom', 'unit', 'unit of measure'];
        const platformKeys = ['platform/vessel', 'platform / vessel', 'platform', 'vessel'];
        const expiryKeys = ['expiry date', 'expiry', 'exp date', 'exp'];

        let added = 0, skipped = 0;

        rows.forEach(row => {
          const nameKey = findKey(row, nameKeys);
          const codeKey = findKey(row, codeKeys);
          const qtyKey = findKey(row, qtyKeys);
          const uomKey = findKey(row, uomKeys);
          const platformKey = findKey(row, platformKeys);
          const expiryKey = findKey(row, expiryKeys);

          const item = nameKey ? String(row[nameKey]).trim() : '';
          const itemCode = codeKey ? String(row[codeKey]).trim() : '';
          const qty = qtyKey ? parseFloat(row[qtyKey]) : NaN;
          const uom = uomKey ? String(row[uomKey]).trim() : '';
          const platform = platformKey ? String(row[platformKey]).trim() : '';
          const expiryDate = expiryKey ? formatExcelDate(row[expiryKey]) : '';

          if (!item || !qty || isNaN(qty) || qty <= 0) {
            skipped++;
            return;
          }

          records.push({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + added,
            item,
            itemCode,
            qty,
            uom,
            type: importType,
            date,
            platform,
            expiryDate
          });
          added++;
        });

        save();
        render();

        if (added && !skipped) {
          setImportStatus(t('importedOk', { count: added, type: importType === 'IN' ? t('typeIn') : t('typeOut') }), 'ok');
        } else if (added && skipped) {
          setImportStatus(t('importedPartial', { count: added, skipped }), 'ok');
        } else {
          setImportStatus(t('noValidRows'), 'err');
        }

        fileInput.value = '';
      } catch (err) {
        console.error(err);
        setImportStatus(t('fileReadError'), 'err');
      }
    };
    reader.readAsArrayBuffer(file);
  });

  render();

  // ---------- 注册 Service Worker（支持离线使用与添加到主屏幕）----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(err => {
        console.log('Service Worker 注册失败：', err);
      });
    });
  }
</script>
