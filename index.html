<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SRS</title>

<!-- PWA 配置 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f5df0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SRS">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #1e2330;
    --muted: #6b7280;
    --border: #e3e5ea;
    --in: #1f9d63;
    --in-bg: #e7f7ef;
    --out: #d64545;
    --out-bg: #fceaea;
    --warn: #b8860b;
    --warn-bg: #fdf3d9;
    --accent: #2f5df0;
    --accent-hover: #2649c4;
    --row-hover: #f7f8fa;
    --sub-bg: #fafbfc;
  }

  * { box-sizing: border-box; }

  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 32px 16px;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 8px;
  }

  h1 {
    font-size: 24px;
    margin: 0;
    letter-spacing: -0.3px;
  }

  header .sub {
    color: var(--muted);
    font-size: 13px;
  }

  .lang-switch select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .panel h2 {
    font-size: 15px;
    margin: 0 0 16px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 12px;
    color: var(--muted);
  }

  input, select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
    font-family: inherit;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .type-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .type-toggle button {
    flex: 1;
    border: none;
    padding: 10px 0;
    background: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
  }

  .type-toggle button.active.in { background: var(--in-bg); color: var(--in); }
  .type-toggle button.active.out { background: var(--out-bg); color: var(--out); }

  .import-row {
    display: flex;
    gap: 10px;
    align-items: end;
    flex-wrap: wrap;
  }

  .import-row .field { min-width: 140px; }

  form#manualForm {
    display: grid;
    grid-template-columns: 1.6fr 1fr 0.9fr 0.9fr 1fr 1.2fr 1.4fr 1.2fr auto;
    gap: 10px;
    align-items: end;
  }

  .add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    height: 42px;
  }
  .add-btn:hover { background: var(--accent-hover); }

  @media (max-width: 1000px) {
    form#manualForm { grid-template-columns: 1fr 1fr; }
    form#manualForm .add-btn { grid-column: span 2; }
  }

  .file-btn {
    background: #fff;
    border: 1px dashed var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  .file-btn:hover { border-color: var(--accent); color: var(--accent); }

  .import-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    height: 42px;
  }
  .import-btn:hover { opacity: 0.85; }

  .import-status {
    font-size: 13px;
    color: var(--muted);
  }
  .import-status.ok { color: var(--in); }
  .import-status.err { color: var(--out); }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: end;
  }

  .toolbar .field { min-width: 150px; }

  .toolbar input[type="text"] {
    flex: 1;
    min-width: 180px;
  }

  .export-btn {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    height: 42px;
  }
  .export-btn:hover { background: var(--bg); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th {
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding: 10px 8px;
  }

  td {
    padding: 12px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tr.item-row { cursor: pointer; }
  tr.item-row:hover { background: var(--row-hover); }
  tr.item-row.expanded { background: var(--row-hover); }
  tr:last-child td { border-bottom: none; }

  .chevron {
    display: inline-block;
    transition: transform 0.15s ease;
    color: var(--muted);
    margin-right: 6px;
    font-size: 11px;
  }
  tr.item-row.expanded .chevron { transform: rotate(90deg); }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.in { background: var(--in-bg); color: var(--in); }
  .badge.out { background: var(--out-bg); color: var(--out); }

  .pill {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    background: #eef0f4;
    color: var(--ink);
    margin: 2px 3px 2px 0;
  }

  .expiry-tag {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .expiry-tag.ok { color: var(--muted); background: #eef0f4; }
  .expiry-tag.soon { color: var(--warn); background: var(--warn-bg); }
  .expiry-tag.expired { color: var(--out); background: var(--out-bg); }
  .expiry-tag.none { color: var(--muted); }

  .qty { font-variant-numeric: tabular-nums; font-weight: 600; }

  .del-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .del-btn:hover { background: var(--out-bg); color: var(--out); }
  .balance-cell { font-size: 16px; font-weight: 700; }

  .detail-row td {
    background: var(--sub-bg);
    padding: 0;
  }

  .detail-wrap {
    padding: 6px 16px 16px 40px;
  }

  .detail-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .detail-table th {
    background: #f1f2f5;
    font-size: 11px;
    padding: 8px 10px;
  }

  .detail-table td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
  }
  .detail-table tr:last-child td { border-bottom: none; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px 0;
    font-size: 14px;
  }

  @media (max-width: 800px) {
    .detail-wrap { padding: 6px 8px 16px 16px; }
  }

  /* ---------- 移动端：表格转卡片布局 ---------- */
  @media (max-width: 700px) {
    body { padding: 16px 10px; }
    .wrap { max-width: 100%; }
    .panel { padding: 16px; }

    table:not(.detail-table) thead { display: none; }
    table:not(.detail-table),
    table:not(.detail-table) tbody,
    table:not(.detail-table) tr,
    table:not(.detail-table) td {
      display: block;
      width: 100%;
    }
    tr.item-row {
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
    }
    tr.item-row td {
      border: none;
      padding: 5px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    tr.item-row td::before {
      content: attr(data-label);
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    tr.item-row td.name-cell {
      font-size: 15px;
      font-weight: 600;
    }
    tr.item-row td.name-cell::before { content: none; }
    .cell-value {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: 100%;
    }
    .detail-row td { display: block; width: 100%; padding: 0; max-width: 100%; }
    .detail-wrap { padding: 6px 4px 16px 4px; max-width: 100%; }

    .detail-table thead { display: none; }
    .detail-table, .detail-table tbody, .detail-table tr, .detail-table td {
      display: block;
      width: 100%;
    }
    .detail-table tr {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .detail-table td {
      border: none;
      padding: 4px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .detail-table td::before {
      content: attr(data-label);
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .detail-table td[data-label=""]::before { content: none; }

    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar .field { min-width: 0; }
    .toolbar input[type="text"] { min-width: 0; }
    .toolbar select, .toolbar input { max-width: 100%; }

    .import-row { flex-direction: column; align-items: stretch; }
    .import-row .field { min-width: 0; }
    .import-row .type-toggle { width: 100% !important; }

    form#manualForm { grid-template-columns: 1fr !important; }
    form#manualForm .add-btn { grid-column: span 1 !important; }

    .pill, .badge, .expiry-tag { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
  }

  /* ---------- 设备锁屏 / 管理员登录 ---------- */
  #lockScreen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #lockScreen.open { display: flex; }

  .lock-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px 26px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.08);
  }

  .lock-card .lock-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin: 0 auto 16px;
  }

  .lock-card h2 {
    font-size: 18px;
    text-align: center;
    margin: 0 0 6px;
  }

  .lock-card .lock-sub {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin-bottom: 22px;
  }

  .pin-dots {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 20px;
  }
  .pin-dots .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: #fff;
    transition: background 0.1s ease, border-color 0.1s ease;
  }
  .pin-dots .dot.filled { background: var(--accent); border-color: var(--accent); }

  .pin-keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .pin-keypad button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 12px;
    padding: 16px 0;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
  }
  .pin-keypad button:active { background: var(--bg); }
  .pin-keypad button.wide { grid-column: span 1; font-size: 13px; color: var(--muted); }

  .lock-error {
    color: var(--out);
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    margin-bottom: 10px;
  }

  .lock-alt-link {
    display: block;
    text-align: center;
    font-size: 13px;
    color: var(--accent);
    cursor: pointer;
    margin-top: 6px;
    background: none;
    border: none;
    width: 100%;
  }
  .lock-alt-link.muted { color: var(--muted); }

  .fingerprint-btn {
    width: 100%;
    border: 1.5px solid var(--accent);
    background: #fff;
    color: var(--accent);
    border-radius: 12px;
    padding: 14px 0;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .fingerprint-btn:hover { background: #eef1fe; }

  .setup-choice {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .setup-choice button {
    border: 1.5px solid var(--border);
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    color: var(--ink);
  }
  .setup-choice button:hover { border-color: var(--accent); }
  .setup-choice button .desc {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ---------- 顶部按钮 ---------- */
  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .admin-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .admin-btn.active { background: var(--in-bg); color: var(--in); border-color: var(--in); }
  .refresh-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 15px;
    color: var(--ink);
  }
  .refresh-btn.spinning svg, .refresh-btn.spinning { animation: srsSpin 0.8s linear infinite; }
  @keyframes srsSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .sync-status {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    margin: -14px 0 16px;
  }
  .sync-status.err { color: var(--out); }

  .admin-notice {
    background: var(--warn-bg);
    color: #92670c;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
  }

  /* ---------- 管理员登录 / 设置 弹窗 ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 22, 28, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 150;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal-card {
    background: var(--panel);
    border-radius: 16px;
    padding: 26px 24px;
    width: 100%;
    max-width: 400px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .modal-card h2 { font-size: 17px; margin: 0 0 6px; }
  .modal-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .modal-card input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    margin-bottom: 12px;
    background: #fafbfc;
  }
  .modal-card input:focus { outline: none; border-color: var(--accent); background: #fff; }
  .modal-btn-row { display: flex; gap: 10px; }
  .modal-btn-row button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 12px 0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .modal-btn-row .btn-primary { background: var(--accent); color: #fff; }
  .modal-btn-row .btn-primary:hover { background: var(--accent-hover); }
  .modal-btn-row .btn-secondary { background: #eef0f4; color: var(--ink); }
  .modal-btn-row .btn-secondary:hover { background: #e3e5ea; }
  .modal-error { color: var(--out); font-size: 13px; margin: -4px 0 12px; min-height: 16px; }
  .modal-status { font-size: 13px; margin-top: 10px; text-align: center; }
  .modal-status.ok { color: var(--in); }
  .modal-status.err { color: var(--out); }

  .settings-toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    border-top: 1px solid var(--border);
    padding-top: 16px;
    margin-top: 6px;
  }
  .settings-toggle-row .chev { color: var(--muted); transition: transform 0.15s ease; font-size: 12px; }
  .settings-toggle-row.open .chev { transform: rotate(90deg); }
  .settings-body { display: none; margin-top: 14px; }
  .settings-body.open { display: block; }
  .warn-box {
    background: var(--warn-bg);
    color: #92670c;
    font-size: 12px;
    line-height: 1.6;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 14px;
  }

  [data-admin-only] { display: none; }
  body.is-admin [data-admin-only] { display: block; }
</style>
</head>
<body>

<!-- 设备解锁屏（PIN / 指纹） -->
<div id="lockScreen">
  <div class="lock-card" id="lockCard"></div>
</div>

<!-- 管理员登录弹窗 -->
<div class="modal-overlay" id="adminModal">
  <div class="modal-card">
    <h2 id="adminModalTitle" data-i18n="adminLoginTitle">管理员登录</h2>
    <div class="sub" id="adminModalSub" data-i18n="adminLoginSub">请输入管理员密钥以新增或删除记录</div>
    <input type="password" id="adminKeyInput" autocomplete="off">
    <div class="modal-error" id="adminModalError"></div>
    <div class="modal-btn-row">
      <button class="btn-secondary" id="adminModalCancel" data-i18n="cancelBtn">取消</button>
      <button class="btn-primary" id="adminModalConfirm" data-i18n="confirmBtn">确认</button>
    </div>

    <div class="settings-toggle-row" id="ghSettingsToggle" style="display:none;">
      <h2 style="font-size:13px;text-transform:uppercase;color:var(--muted);margin:0;" data-i18n="ghSettingsTitle">GitHub 同步设置</h2>
      <span class="chev">▶</span>
    </div>
    <div class="settings-body" id="ghSettingsBody">
      <div class="warn-box" data-i18n="ghSettingsWarn">⚠️ Token 会以明文保存在本设备浏览器中，请使用仅限此仓库、仅勾选 Contents 读写权限的 Fine-grained Token。</div>
      <input type="text" id="ghOwner" data-i18n-ph="ghOwnerLabel" autocomplete="off">
      <input type="text" id="ghRepo" data-i18n-ph="ghRepoLabel" autocomplete="off">
      <input type="text" id="ghPath" placeholder="data.json" value="data.json" autocomplete="off">
      <input type="text" id="ghBranch" placeholder="main" value="main" autocomplete="off">
      <input type="password" id="ghToken" data-i18n-ph="ghTokenLabel" autocomplete="off">
      <div class="modal-btn-row">
        <button class="btn-primary" id="saveGhSettingsBtn" data-i18n="saveGhSettingsBtn" style="flex:none; width:100%;">保存设置</button>
      </div>
      <div class="modal-status" id="ghSettingsStatus"></div>
    </div>
  </div>
</div>

<div class="wrap">

  <header>
    <div>
      <h1 data-i18n="appTitle">SRS</h1>
      <div class="sub" data-i18n="appSubtitle">按货物显示总库存 — 点击列表可查看该货物的进出明细</div>
    </div>
    <div class="header-actions">
      <div class="lang-switch">
        <select id="langSelect">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ms">Bahasa Melayu</option>

  let currentLang = localStorage.getItem('stockAppLang') || 'en';
  if (!translations[currentLang]) currentLang = 'en';

  function t(key, params) {
    let str = (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || key;
    if (params) {
      Object.keys(params).forEach(k => {
        str = str.replace(`{${k}}`, params[k]);
      });
    }
    return str;
  }

  function applyStaticTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
    });
    document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : currentLang === 'ms' ? 'ms' : 'en';
  }

  // ================= 共享数据 / 权限 / 设备锁 =================
  const DATA_PATH = './data.json';
  const LOCAL_CACHE_KEY = 'srsDataCache_v1';
  const DEVICE_LOCK_KEY = 'srsDeviceLock_v1';
  const GH_CONFIG_KEY = 'srsGhConfig_v1';
  const ADMIN_SESSION_KEY = 'srsAdminSession_v1';

  async function sha256(text) {
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function getGhConfig() {
    try {
      const raw = localStorage.getItem(GH_CONFIG_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function utf8ToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  // 拉取共享数据（GitHub Pages 静态文件，公开可读，无需 Token）
  async function fetchSharedData() {
    const res = await fetch(DATA_PATH + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch failed: ' + res.status);
    const json = await res.json();
    return {
      adminKeyHash: json.adminKeyHash || '',
      records: Array.isArray(json.records) ? json.records : []
    };
  }

  // 把最新数据写回 GitHub（需要管理员在本机配置好 Token）
  async function pushSharedData(newRecords, newAdminKeyHash) {
    const cfg = getGhConfig();
    if (!cfg || !cfg.owner || !cfg.repo || !cfg.token) {
      throw new Error(t('ghConfigMissing'));
    }
    const apiBase = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path || 'data.json'}`;
    const getRes = await fetch(`${apiBase}?ref=${encodeURIComponent(cfg.branch || 'main')}&t=${Date.now()}`, {
      headers: { 'Authorization': `token ${cfg.token}`, 'Accept': 'application/vnd.github+json' }
    });
    let sha;
    if (getRes.ok) {
      sha = (await getRes.json()).sha;
    } else if (getRes.status !== 404) {
      const err = await getRes.json().catch(() => ({}));
      throw new Error(err.message || ('GET failed: ' + getRes.status));
    }

    const fileContent = JSON.stringify({ adminKeyHash: newAdminKeyHash, records: newRecords }, null, 2);
    const putRes = await fetch(apiBase, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${cfg.token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: 'SRS: update stock records',
        content: utf8ToBase64(fileContent),
        branch: cfg.branch || 'main',
        ...(sha ? { sha } : {})
      })
    });
    if (!putRes.ok) {
      const err = await putRes.json().catch(() => ({}));
      throw new Error(err.message || ('PUT failed: ' + putRes.status));
    }
  }

  function setSyncStatus(msg, kind) {
    const el = document.getElementById('syncStatus');
    el.textContent = msg;
    el.className = 'sync-status' + (kind ? ' ' + kind : '');
  }

  // 加载数据：优先联网获取最新共享数据，失败则退回本机缓存
  async function loadDataAndRender(silent) {
    const refreshBtn = document.getElementById('refreshBtn');
    refreshBtn.classList.add('spinning');
    if (!silent) setSyncStatus(t('syncing'));
    try {
      const data = await fetchSharedData();
      records = data.records;
      adminKeyHash = data.adminKeyHash;
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(data));
      setSyncStatus(t('syncedAt', { time: new Date().toLocaleTimeString() }));
    } catch (err) {
      console.error(err);
      try {
        const cached = JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY));
        if (cached) {
          records = cached.records || [];
          adminKeyHash = cached.adminKeyHash || '';
          setSyncStatus(t('offlineUsingCache'), 'err');
        } else {
          records = [];
          adminKeyHash = '';
          setSyncStatus(t('fetchFailed'), 'err');
        }
      } catch (e2) {
        records = [];
        adminKeyHash = '';
        setSyncStatus(t('fetchFailed'), 'err');
      }
    }
    refreshBtn.classList.remove('spinning');
    render();
  }

  // 新增/导入记录后：重新拉取最新数据，合并，推送回 GitHub
  async function addRecordsAndSync(newRecords) {
    setSyncStatus(t('syncing'));
    try {
      const latest = await fetchSharedData();
      const merged = latest.records.concat(newRecords);
      await pushSharedData(merged, latest.adminKeyHash);
      records = merged;
      adminKeyHash = latest.adminKeyHash;
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ adminKeyHash, records }));
      setSyncStatus(t('syncedAt', { time: new Date().toLocaleTimeString() }));
      return true;
    } catch (err) {
      console.error(err);
      setSyncStatus(t('syncFailed') + ': ' + err.message, 'err');
      return false;
    }
  }

  async function deleteRecordAndSync(id) {
    setSyncStatus(t('syncing'));
    try {
      const latest = await fetchSharedData();
      const merged = latest.records.filter(r => r.id !== id);
      await pushSharedData(merged, latest.adminKeyHash);
      records = merged;
      adminKeyHash = latest.adminKeyHash;
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ adminKeyHash, records }));
      setSyncStatus(t('syncedAt', { time: new Date().toLocaleTimeString() }));

    }
  }

  function populateSuggestLists() {

  // 货物名称 -> 货物编号 映射（取该货物最近使用过的编号）
  function getNameToCodeMap() {
    const map = {};

  function groupKey(r) {
    // group by item code when present, otherwise by item name
    return (r.itemCode && r.itemCode.trim()) ? 'code:' + r.itemCode.trim().toLowerCase() : 'name:' + r.item.trim().toLowerCase();

  // Build per-item groups: running balance, transaction list, platforms, nearest expiry
  function buildGroups() {
    const sorted = records.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const groups = {};

    sorted.forEach(r => {
      const key = groupKey(r);
      if (!groups[key]) {
        groups[key] = {
          key,
          item: r.item,
          itemCode: r.itemCode || '',
          uom: r.uom || '',
          balance: 0,
          platforms: new Set(),
          transactions: []
        };
      }
      const g = groups[key];
      g.balance += r.type === 'IN' ? r.qty : -r.qty;
      if (r.uom) g.uom = r.uom;
      if (r.platform) g.platforms.add(r.platform);
      g.transactions.push({ ...r, runningBalance: g.balance });
    });

    // nearest (soonest) expiry per group, ignoring blanks
    Object.values(groups).forEach(g => {
      const dates = g.transactions.map(t => t.expiryDate).filter(Boolean).sort();
      g.nearestExpiry = dates.length ? dates[0] : '';
      g.transactions.reverse(); // newest first for display
    });

    return Object.values(groups);
  }

  function expiryStatus(dateStr) {
    if (!dateStr) return 'none';
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const exp = new Date(dateStr);
    if (isNaN(exp.getTime())) return 'none';
    const diffDays = Math.floor((exp - today) / (1000 * 60 * 60 * 24));
    if (diffDays < 0) return 'expired';
    if (diffDays <= 30) return 'soon';
    return 'ok';
  }

  function expiryLabel(dateStr) {
    const status = expiryStatus(dateStr);
    if (status === 'none') return '<span class="expiry-tag none">—</span>';
    if (status === 'expired') return `<span class="expiry-tag expired">${dateStr} · ${t('expiredSuffix')}</span>`;
    if (status === 'soon') return `<span class="expiry-tag soon">${dateStr} · ${t('expiringSoonSuffix')}</span>`;
    return `<span class="expiry-tag ok">${dateStr}</span>`;
  }

      sortedPlatforms.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');

    if (sortedPlatforms.includes(current)) filterPlatform.value = current;
  }

  function render() {
    let groups = buildGroups();

    const q = searchInput.value.trim().toLowerCase();

    groups = groups.filter(g => {

      const matchesPlatform = platformF === 'all' || g.platforms.has(platformF);
      const matchesExpiry = expiryF === 'all' || expiryStatus(g.nearestExpiry) === expiryF;
      return matchesSearch && matchesPlatform && matchesExpiry;
    });

    if (sortF === 'item') {
      groups.sort((a, b) => a.item.localeCompare(b.item));
    } else if (sortF === 'expiry') {
      groups.sort((a, b) => {
        if (!a.nearestExpiry) return 1;
        if (!b.nearestExpiry) return -1;
        return a.nearestExpiry.localeCompare(b.nearestExpiry);
      });

      groups.sort((a, b) => b.balance - a.balance);

  // Matches flexible header names to our fields
  function findKey(rowObj, candidates) {
    const keys = Object.keys(rowObj);
    for (const cand of candidates) {
      const hit = keys.find(k => k.trim().toLowerCase() === cand);
      if (hit) return hit;
    }
    // fallback: partial match
    for (const cand of candidates) {
      const hit = keys.find(k => k.trim().toLowerCase().includes(cand));
      if (hit) return hit;
    }
    return null;
  }

  // Excel may give dates as serial numbers or as strings; normalize to YYYY-MM-DD
  function formatExcelDate(value) {
    if (value === null || value === undefined || value === '') return '';
    if (typeof value === 'number') {
      const parsed = XLSX.SSF.parse_date_code(value);
      if (parsed) {
        const mm = String(parsed.m).padStart(2, '0');
        const dd = String(parsed.d).padStart(2, '0');
        return `${parsed.y}-${mm}-${dd}`;
      }
    }
    const str = String(value).trim();
    const asDate = new Date(str);
    if (!isNaN(asDate.getTime()) && /\d/.test(str)) {
      const yyyy = asDate.getFullYear();
      const mm = String(asDate.getMonth() + 1).padStart(2, '0');
      const dd = String(asDate.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }
    return str;
  }

  document.getElementById('importBtn').addEventListener('click', () => {
    if (!isAdmin) return;
    const fileInput = document.getElementById('excelFile');
    const file = fileInput.files[0];
    const date = document.getElementById('importDate').value || new Date().toISOString().slice(0, 10);

    if (!file) {
      setImportStatus(t('chooseFileFirst'), 'err');
      return;
    }
    if (typeof XLSX === 'undefined') {
      setImportStatus(t('xlsxLibFailed'), 'err');
      return;
    }

    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

        if (!rows.length) {
          setImportStatus(t('noRowsFound'), 'err');
          return;
        }

        const nameKeys = ['item name', 'item', 'name', 'description', 'product'];
        const codeKeys = ['item code', 'code', 'sku', 'item no', 'item number', 'part no'];
        const qtyKeys = ['quantity', 'qty'];
        const uomKeys = ['uom', 'unit', 'unit of measure'];
        const platformKeys = ['platform/vessel', 'platform / vessel', 'platform', 'vessel'];
        const expiryKeys = ['expiry date', 'expiry', 'exp date', 'exp'];

        let added = 0, skipped = 0;
        const newRecords = [];

        rows.forEach(row => {
          const nameKey = findKey(row, nameKeys);
          const codeKey = findKey(row, codeKeys);
          const qtyKey = findKey(row, qtyKeys);
          const uomKey = findKey(row, uomKeys);
          const platformKey = findKey(row, platformKeys);
          const expiryKey = findKey(row, expiryKeys);

          const item = nameKey ? String(row[nameKey]).trim() : '';
          const itemCode = codeKey ? String(row[codeKey]).trim() : '';
          const qty = qtyKey ? parseFloat(row[qtyKey]) : NaN;
          const uom = uomKey ? String(row[uomKey]).trim() : '';
          const platform = platformKey ? String(row[platformKey]).trim() : '';
          const expiryDate = expiryKey ? formatExcelDate(row[expiryKey]) : '';

          if (!item || !qty || isNaN(qty) || qty <= 0) {
            skipped++;
            return;
          }

          newRecords.push({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + added,
            item,
            itemCode,
            qty,
            uom,
            type: importType,
            date,
            platform,
            expiryDate
          });
          added++;
        });

        if (!added) {
          setImportStatus(t('noValidRows'), 'err');
          return;
        }

        setImportStatus(t('syncing'));
        const ok = await addRecordsAndSync(newRecords);
        render();

        if (!ok) {
          setImportStatus(t('syncFailed'), 'err');
          return;
        }

        if (added && !skipped) {
          setImportStatus(t('importedOk', { count: added, type: importType === 'IN' ? t('typeIn') : t('typeOut') }), 'ok');
        } else {
          setImportStatus(t('importedPartial', { count: added, skipped }), 'ok');
        }

        fileInput.value = '';
      } catch (err) {
        console.error(err);
        setImportStatus(t('fileReadError'), 'err');
      }
    };
    reader.readAsArrayBuffer(file);

  const ghSettingsBody = document.getElementById('ghSettingsBody');

  function updateAdminUI() {
    document.body.classList.toggle('is-admin', isAdmin);
    adminBtnLabel.textContent = isAdmin ? t('logoutAdminBtn') : t('adminLoginBtn');
    adminToggleBtn.classList.toggle('active', isAdmin);
    adminNotice.style.display = isAdmin ? 'none' : 'block';
  }

  function openAdminModal() {
    adminKeyInput.value = '';
    adminModalError.textContent = '';
    const isFirstTimeSetup = !adminKeyHash;
    adminModalTitle.textContent = isFirstTimeSetup ? t('adminSetupTitle') : t('adminLoginTitle');
    adminModalSub.textContent = isFirstTimeSetup ? t('adminSetupSub') : t('adminLoginSub');
    ghSettingsToggle.style.display = 'flex';
    loadGhConfig();
    adminModal.classList.add('open');
    setTimeout(() => adminKeyInput.focus(), 50);
  }

  function closeAdminModal() {
    adminModal.classList.remove('open');
  }

  adminToggleBtn.addEventListener('click', () => {
    if (isAdmin) {
      isAdmin = false;
      sessionStorage.removeItem(ADMIN_SESSION_KEY);
      updateAdminUI();
      render();
      return;
    }
    openAdminModal();
  });

  adminModalCancel.addEventListener('click', closeAdminModal);
  adminKeyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') adminModalConfirm.click();
  });

  adminModalConfirm.addEventListener('click', async () => {
    const val = adminKeyInput.value;
    if (!val) {
      adminModalError.textContent = t('adminKeyWrong');
      return;
    }
    const hash = await sha256(val);

    if (!adminKeyHash) {
      // 首次设置管理员密钥
      if (val.length < 6) {
        adminModalError.textContent = t('adminKeyTooShort');
        return;
      }
      const cfg = getGhConfig();
      if (!cfg || !cfg.owner || !cfg.repo || !cfg.token) {
        adminModalError.textContent = t('ghConfigMissing');
        return;
      }
      adminModalConfirm.disabled = true;
      try {
        await pushSharedData(records, hash);
        adminKeyHash = hash;
        isAdmin = true;
        sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
        localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ adminKeyHash, records }));
        closeAdminModal();
        updateAdminUI();
        render();
      } catch (err) {
        adminModalError.textContent = err.message;
      }
      adminModalConfirm.disabled = false;
      return;
    }

    if (hash !== adminKeyHash) {
      adminModalError.textContent = t('adminKeyWrong');
      return;
    }
    isAdmin = true;
    sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
    closeAdminModal();
    updateAdminUI();
    render();
  });

  // ---- GitHub 同步设置（管理员本机配置） ----
  ghSettingsToggle.addEventListener('click', () => {
    ghSettingsToggle.classList.toggle('open');
    ghSettingsBody.classList.toggle('open');
  });

  function loadGhConfig() {
    const cfg = getGhConfig();
    if (!cfg) return;
    document.getElementById('ghOwner').value = cfg.owner || '';
    document.getElementById('ghRepo').value = cfg.repo || '';
    document.getElementById('ghPath').value = cfg.path || 'data.json';
    document.getElementById('ghBranch').value = cfg.branch || 'main';
    document.getElementById('ghToken').value = cfg.token || '';
  }

  document.getElementById('saveGhSettingsBtn').addEventListener('click', () => {
    const cfg = {
      owner: document.getElementById('ghOwner').value.trim(),
      repo: document.getElementById('ghRepo').value.trim(),
      path: document.getElementById('ghPath').value.trim() || 'data.json',
      branch: document.getElementById('ghBranch').value.trim() || 'main',
      token: document.getElementById('ghToken').value.trim()
    };
    const statusEl = document.getElementById('ghSettingsStatus');
    if (!cfg.owner || !cfg.repo || !cfg.token) {
      statusEl.textContent = t('ghSettingsIncomplete');
      statusEl.className = 'modal-status err';
      return;
    }
    localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg));
    statusEl.textContent = t('ghSettingsSaved');
    statusEl.className = 'modal-status ok';
  });

  // ================= 刷新 / 自动同步 =================
  document.getElementById('refreshBtn').addEventListener('click', () => loadDataAndRender(false));

  setInterval(() => loadDataAndRender(true), 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') loadDataAndRender(true);
  });

  // ================= 设备锁（PIN / 指纹） =================
  const lockScreen = document.getElementById('lockScreen');
  const lockCard = document.getElementById('lockCard');

  function getDeviceLock() {
    try {
      const raw = localStorage.getItem(DEVICE_LOCK_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function bufToBase64(buf) {
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }
  function base64ToBuf(b64) {
    return Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
  }

  async function platformAuthAvailable() {
    return !!(window.PublicKeyCredential &&
      PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable &&
      await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  }

  function lockScreenOpen() { lockScreen.classList.add('open'); }
  function lockScreenClose() { lockScreen.classList.remove('open'); }

  // ---- 首次设置：选择 PIN 或指纹 ----
  async function renderSetupChoice() {
    const hasBiometric = await platformAuthAvailable();
    lockCard.innerHTML = `
      <div class="lock-icon">🔒</div>
      <h2>${t('deviceLockSetupTitle')}</h2>
      <div class="lock-sub">${t('deviceLockSetupSub')}</div>
      <div class="setup-choice">
        ${hasBiometric ? `
          <button id="chooseFingerprint">${t('setupFingerprintOption')}<span class="desc">${t('setupFingerprintOptionDesc')}</span></button>
        ` : ''}
        <button id="choosePin">${t('setupPinOption')}<span class="desc">${t('setupPinOptionDesc')}</span></button>
      </div>
      ${!hasBiometric ? `<div class="lock-error" style="margin-top:10px;">${t('pinNotAvailable')}</div>` : ''}
    `;
    if (hasBiometric) {
      document.getElementById('chooseFingerprint').addEventListener('click', setupFingerprint);
    }
    document.getElementById('choosePin').addEventListener('click', () => renderPinSetup(1));
  }

  // ---- PIN 设置（第一次输入 -> 第二次确认） ----
  let pendingPin = '';

  function renderPinSetup(stage) {
    lockCard.innerHTML = `
      <div class="lock-icon">🔒</div>
      <h2>${t('deviceLockSetupTitle')}</h2>
      <div class="lock-sub">${stage === 1 ? t('enterNewPin') : t('confirmNewPin')}</div>
      <div class="pin-dots" id="pinDots">
        ${Array.from({length: 6}).map(() => '<div class="dot"></div>').join('')}
      </div>
      <div class="lock-error" id="pinError"></div>
      <div class="pin-keypad" id="pinKeypad"></div>
    `;
    buildKeypad(stage === 1 ? handlePinSetupInput1 : handlePinSetupInput2);
  }

  let currentPinBuffer = '';

  function buildKeypad(onDigit) {
    const keypad = document.getElementById('pinKeypad');
    const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
    currentPinBuffer = '';
    keypad.innerHTML = keys.map(k => k ? `<button data-key="${k}" class="${k === '⌫' ? 'wide' : ''}">${k}</button>` : '<div></div>').join('');
    keypad.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        if (key === '⌫') {
          currentPinBuffer = currentPinBuffer.slice(0, -1);
        } else if (currentPinBuffer.length < 6) {
          currentPinBuffer += key;
        }
        updatePinDots();
        if (currentPinBuffer.length === 6) onDigit(currentPinBuffer);
      });
    });
  }

  function updatePinDots() {
    const dots = document.querySelectorAll('#pinDots .dot');
    dots.forEach((d, i) => d.classList.toggle('filled', i < currentPinBuffer.length));
  }

  function handlePinSetupInput1(pin) {
    pendingPin = pin;
    setTimeout(() => renderPinSetup(2), 150);
  }

  async function handlePinSetupInput2(pin) {
    if (pin !== pendingPin) {
      document.getElementById('pinError').textContent = t('pinMismatch');
      setTimeout(() => renderPinSetup(1), 700);
      return;
    }
    const hash = await sha256(pin);
    localStorage.setItem(DEVICE_LOCK_KEY, JSON.stringify({ method: 'pin', hash }));
    lockScreenClose();
    boot();
  }

  // ---- 指纹注册 ----
  async function setupFingerprint() {
    try {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const userId = crypto.getRandomValues(new Uint8Array(16));
      const cred = await navigator.credentials.create({
        publicKey: {
          challenge,
          rp: { name: 'SRS', id: location.hostname },
          user: { id: userId, name: 'srs-user', displayName: 'SRS User' },
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
          authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
          timeout: 60000
        }
      });
      const credentialId = bufToBase64(cred.rawId);
      localStorage.setItem(DEVICE_LOCK_KEY, JSON.stringify({ method: 'webauthn', credentialId }));
      lockScreenClose();
      boot();
    } catch (err) {
      console.error(err);
      renderSetupChoice();
      setTimeout(() => alert(t('fingerprintSetupFailed')), 50);
    }
  }

  // ---- 解锁界面 ----
  function renderUnlockPin(lock) {
    lockCard.innerHTML = `
      <div class="lock-icon">🔒</div>
      <h2>${t('unlockTitle')}</h2>
      <div class="lock-sub">${t('enterPinToUnlock')}</div>
      <div class="pin-dots" id="pinDots">
        ${Array.from({length: 6}).map(() => '<div class="dot"></div>').join('')}
      </div>
      <div class="lock-error" id="pinError"></div>
      <div class="pin-keypad" id="pinKeypad"></div>
      <button class="lock-alt-link muted" id="forgotPinBtn">${t('forgotPinLink')}</button>
    `;
    buildKeypad(async (pin) => {
      const hash = await sha256(pin);
      if (hash === lock.hash) {
        lockScreenClose();
        boot();
      } else {
        document.getElementById('pinError').textContent = t('wrongPin');
        setTimeout(() => renderUnlockPin(lock), 500);
      }
    });
    document.getElementById('forgotPinBtn').addEventListener('click', () => {
      if (confirm(t('forgotPinConfirm'))) {
        localStorage.removeItem(DEVICE_LOCK_KEY);
        renderSetupChoice();
      }
    });
  }

  async function renderUnlockFingerprint(lock) {
    lockCard.innerHTML = `
      <div class="lock-icon">🔒</div>
      <h2>${t('unlockTitle')}</h2>
      <div class="lock-sub">${t('tapToUnlock')}</div>
      <button class="fingerprint-btn" id="fpUnlockBtn">👆 ${t('tapToUnlock')}</button>
      <div class="lock-error" id="fpError"></div>
      <button class="lock-alt-link muted" id="forgotPinBtn2">${t('forgotPinLink')}</button>
    `;
    document.getElementById('forgotPinBtn2').addEventListener('click', () => {
      if (confirm(t('forgotPinConfirm'))) {
        localStorage.removeItem(DEVICE_LOCK_KEY);
        renderSetupChoice();
      }
    });

    async function tryUnlock() {
      try {
        const challenge = crypto.getRandomValues(new Uint8Array(32));
        await navigator.credentials.get({
          publicKey: {
            challenge,
            allowCredentials: [{ id: base64ToBuf(lock.credentialId), type: 'public-key' }],
            userVerification: 'required',
            timeout: 60000
          }
        });
        lockScreenClose();
        boot();
      } catch (err) {
        console.error(err);
        document.getElementById('fpError').textContent = t('fingerprintPromptFailed');
      }
    }
    document.getElementById('fpUnlockBtn').addEventListener('click', tryUnlock);
    tryUnlock();
  }

  // ---- 设备锁入口 ----
  async function initDeviceLock() {
    const lock = getDeviceLock();
    lockScreenOpen();
    if (!lock) {
      await renderSetupChoice();
      return false;
    }
    if (lock.method === 'webauthn') {
      await renderUnlockFingerprint(lock);
    } else {
      renderUnlockPin(lock);
    }
    return false;
  }

  // ================= 启动流程 =================
  async function boot() {
    updateAdminUI();
    await loadDataAndRender(false);
  }

  (async function start() {
    applyStaticTranslations();
    await initDeviceLock();
  })();

  // ---------- 注册 Service Worker（支持离线使用与添加到主屏幕）----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(err => {
        console.log('Service Worker 注册失败：', err);
      });
    });
  }
</script>

</body>
</html>
